[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paip"
version = "0.1.0"
description = "PAIP US-001 event slice (SearXNG -> extraction -> event dedup -> Telegram)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "APScheduler>=3.10.4",
  "aiogram>=3.13.1",
  "pydantic>=2.8.2",
  "sqlalchemy>=2.0.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
]

[project.scripts]
paip = "paip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
