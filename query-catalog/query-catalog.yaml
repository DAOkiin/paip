queries:
  - id: Schema.EnsureVersion
    owner: team-paip
    purpose: >
      Ensures SQLite schema is present and aligned with the runtime schema version.
      On version mismatch, resets known tables and recreates the current schema.
    source: sqlite.main
    contract:
      params: []
      returns:
        cardinality: "0..1"
        shape: SchemaEnsureResult
      ordering: null
      pagination: null
      errors:
        - schema_reset_failed
        - sqlite_error
    data_objects:
      read:
        - sqlite_pragma.user_version
      write:
        - monitors
        - runs
        - source_hits
        - event_claims
        - events
        - notifications
        - canonical_items
        - raw_hits
    consistency:
      transaction: required
      idempotent: conditional
      idempotency_notes: >
        Idempotent when schema version is already current. Performs destructive reset on
        version mismatch by design of MVP migration strategy.
    security:
      pii: false
      tenant_boundary: not_applicable
      access: internal:store
      notes: Internal bootstrap path only.
    performance:
      hot_path: false
      notes: Invoked during store initialization.
    observability:
      log_query_id: true
      trace: recommended
      sql_comment: disabled
      metrics:
        - db.schema.ensure.duration_ms
    links:
      use_cases:
        - NFR-002
      call_sites:
        - src/paip/db.py
      docs:
        - docs/iterations/2026-02-mvp/04_architecture.md
    lifecycle:
      status: active
      since: "2026-02-19"

